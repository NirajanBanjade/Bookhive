<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Profile</title>
</head>
<body>
  <h1>User Profile</h1>

  <form method="POST" enctype="multipart/form-data">
    <label for="bio">Bio</label><br />
    <textarea id="bio" name="bio" placeholder="Write your bio here..."></textarea>
    <br /><br />

    <label for="profile_pic">Profile Picture</label><br />
    <input id="profile_pic" name="profile_pic" type="file" accept="image/*" />
    <br /><br />

    <button type="submit">Save</button>
  </form>
</body>
</html>
