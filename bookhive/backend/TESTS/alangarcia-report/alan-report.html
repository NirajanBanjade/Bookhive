-123\&quot;);\nexpect(result).to.be.instanceOf(Set);\nexpect(result.size).to.equal(3);\nexpect(result.has(\&quot;A\&quot;)).to.be.true;\nexpect(result.has(\&quot;B\&quot;)).to.be.true;\nexpect(result.has(\&quot;C\&quot;)).to.be.true;\nexpect(result.has(\&quot;D\&quot;)).to.be.false;\n// optional: validate queries\nexpect(fakeToRead.findOne.calledOnce).to.be.true;\nexpect(fakeCollection.findOne.calledOnce).to.be.true;&quot;,&quot;err&quot;:{},&quot;uuid&quot;:&quot;07a42afd-2f0c-436c-8715-138e8e177efd&quot;,&quot;parentUUID&quot;:&quot;20e9282f-bcc6-4c15-9200-7157c3c19f95&quot;,&quot;isHook&quot;:false,&quot;skipped&quot;:false}],&quot;suites&quot;:[],&quot;passes&quot;:[&quot;07a42afd-2f0c-436c-8715-138e8e177efd&quot;],&quot;failures&quot;:[],&quot;pending&quot;:[],&quot;skipped&quot;:[],&quot;duration&quot;:4,&quot;root&quot;:false,&quot;rootEmpty&quot;:false,&quot;_timeout&quot;:15000},{&quot;uuid&quot;:&quot;0f8828dd-b366-45be-9b68-d27ab90b3feb&quot;,&quot;title&quot;:&quot;InterestProfileBuilder.buildForUser&quot;,&quot;fullFile&quot;:&quot;C:\\Users\\garci\\Documents\\CS3398\\swe_project\\bookhive\\backend\\TESTS\\interestProfileBuilder.test.js&quot;,&quot;file&quot;:&quot;\\TESTS\\interestProfileBuilder.test.js&quot;,&quot;beforeHooks&quot;:[{&quot;title&quot;:&quot;\&quot;before each\&quot; hook in \&quot;InterestProfileBuilder.buildForUser\&quot;&quot;,&quot;fullTitle&quot;:&quot;InterestProfileBuilder.buildForUser \&quot;before each\&quot; hook in \&quot;InterestProfileBuilder.buildForUser\&quot;&quot;,&quot;timedOut&quot;:false,&quot;duration&quot;:1,&quot;pass&quot;:false,&quot;fail&quot;:false,&quot;pending&quot;:false,&quot;code&quot;:&quot;toReadRepo = {\n  getBooksForUser: sinon.stub(),\n};\ncollectionRepo = {\n  getBooksByStatus: sinon.stub(),\n};\nprofileRepo = {\n  upsert: sinon.stub(),\n};\ngetVolume = sinon.stub();\ntokenizer = {\n  tokens: sinon.stub(),\n};\nbuilder = new InterestProfileBuilder({\n  toReadRepo,\n  collectionRepo,\n  profileRepo, uot;,\n  },\n});\ngetVolume.withArgs(\&quot;B\&quot;).resolves({\n  volumeInfo: {\n    authors: [\&quot;Alice\&quot;, \&quot;Bob\&quot;],\n    categories: [\&quot;Fantasy\&quot;, \&quot;Horror\&quot;],\n    description: \&quot;dragon knight\&quot;,\n  },\n});\n// 3) Tokenizer splits &amp; lowercases\ntokenizer.tokens.callsFake((text) =&gt;\n  text.toLowerCase().split(/\\s+/).filter(Boolean)\n);\n// 4) upsert stub returns stored profile\nconst fakeProfileDoc = { _id: \&quot;p1\&quot;, userId };\nprofileRepo.upsert.resolves(fakeProfileDoc);\nconst { profile, warnings } = await builder.buildForUser(userId);\nexpect(warnings).to.deep.equal([]);\nexpect(profile).to.equal(fakeProfileDoc);\n// Check that upsert was called with expected structure\nexpect(profileRepo.upsert.calledOnceWith(\n  userId,\n  sinon.match({\n    userId,\n    authors: sinon.match.array,\n    categories: sinon.match.array,\n    keywords: sinon.match.array,\n    sourceCounts: {\n      toRead: 2,\n      currentlyReading: 0,\n      finished: 0,\n    },\n  })\n)).to.be.true;\nconst upsertArgs = profileRepo.upsert.firstCall.args[1];\nconst authors = upsertArgs.authors;\nconst categories = upsertArgs.categories;\nconst alice = authors.find((a) =&gt; a.name === \&quot;alice\&quot;);\nconst bob = authors.find((a) =&gt; a.name === \&quot;bob\&quot;);\nexpect(alice.weight).to.equal(1);\nexpect(bob.weight).to.be.closeTo(0.5, 1e-6);\nconst fantasy = categories.find((c) =&gt; c.name === \&quot;fantasy\&quot;);\nconst horror = categories.find((c) =&gt; c.name === \&quot;horror\&quot;);\nexpect(fantasy.weight).to.equal(1);\nexpect(horror.weight).to.be.closeTo(0.5, 1e-6);&quot;,&quot;err&quot;:{},&quot;uuid&quot;:&quot;af119399-79a5-442c-be8f-7cf320ea752c&quot;,&quot;parentUUID&quot;:&quot;0f8828dd-b366-45be-9b68-d27ab90b3feb&quot;,&quot;isHook&quot;:false,&quot;skipped&quot;:false}],&quot;suites&quot;:[],&quot;passes&quot;:[&quot;af119399-79a5-442c-be8f-7cf320ea752c&quot;],&quot;failures&quot;:[],&quot;pending&quot
